[build]
  command = "npm ci && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "NOTION_SEAT_DB_ID,NOTION_DRIFT_REPORT_DB_ID,NOTION_JD_PIPELINE_DB_ID,BEEHIIV_PUB_ID,DEMO_FIRST_NAME,DEMO_LAST_NAME,DEMO_ACCOUNT_EMAIL"
  SECRETS_SCAN_OMIT_PATHS = "supabase/migrations"

[functions]
  directory = "netlify/functions"
  included_files = ["netlify/functions/lib/**"]
  node_bundler = "esbuild"

[[headers]]
  for = "/*.html"
  [headers.values]
    Content-Type = "text/html; charset=UTF-8"

[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=UTF-8"

# Fixed redirect – www → apex (desired behavior)
[[redirects]]
  from = "https://www.thispagedoesnotexist12345.tech/*"
  to = "https://thispagedoesnotexist12345.tech/:splat"
  status = 301
  force = true

# Scoped .us host redirect to the canonical .com host
[[redirects]]
  from = "https://thispagedoesnotexist12345.us/*"
  to = "https://www.thispagedoesnotexist12345.com/:splat"
  status = 301
  force = true

# Redirect www sub-domain for the .com site to the apex domain
[[redirects]]
  from = "https://www.thispagedoesnotexist12345.com/*"
  to = "https://thispagedoesnotexist12345.com/:splat"
  status = 301
  force = true

# Maintenance mode = false: keep the 503 redirect disabled and use normal routing.
# [[redirects]]
#   from = "/*"
#   to = "/maintenance.html"
#   status = 503
#   force = true

# API function redirects must precede the SPA fallback.
[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200
  force = true

[[redirects]]
  from = "/api/seat-status"
  to = "/.netlify/functions/seat-status"
  status = 200
  force = true

[[redirects]]
  from = "/api/seat-request"
  to = "/.netlify/functions/seat-request"
  status = 200
  force = true

[[redirects]]
  from = "/api/verify-age"
  to = "/.netlify/functions/verify-age"
  status = 200
  force = true

[[redirects]]
  from = "/api/seat-ready"
  to = "/.netlify/functions/seat-ready"
  status = 200
  force = true

[[redirects]]
  from = "/api/seat-map"
  to = "/.netlify/functions/seat-map"
  status = 200
  force = true

[[redirects]]
  from = "/api/seat-claim"
  to = "/.netlify/functions/seat-claim"
  status = 200
  force = true

[[redirects]]
  from = "/api/mission-control-bind"
  to = "/.netlify/functions/mission-control-bind"
  status = 200
  force = true

[[redirects]]
  from = "/api/set-departure"
  to = "/.netlify/functions/set-departure"
  status = 200
  force = true

[[redirects]]
  from = "/api/trpc/*"
  to = "/.netlify/functions/trpc/:splat"
  status = 200
  force = true

# Catch-all for any API path not enumerated above: route to the matching
# function so unlisted endpoints 404 from the function layer instead of
# silently falling through to the SPA shell with a 200.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# Maintenance mode = false: SPA fallback is the final redirect rule.
# No force: static assets and standalone pages (door.html, request-seat.html,
# seat-selection.html, robots.txt, sitemap.xml) must win over the SPA shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
