# Install lockfile deps in CI before verify/build. Netlify Git CD uses the
# same `npm ci` command from netlify.toml. Image matches .nvmrc / NODE_VERSION.

stages:
  - verify

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH =~ /^cursor\//

install-and-build:
  stage: verify
  image: node:20-bookworm
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour
    when: on_success
