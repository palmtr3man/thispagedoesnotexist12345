<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>The Ultimate Journey — Maintenance</title>
  <style>
    :root{color-scheme:dark;--accent:#a8c400;--bg:#0a0a0a;--muted:#b7b7b7}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:#fff;font:16px system-ui,-apple-system,Segoe UI,sans-serif}
    main{width:min(560px,calc(100% - 40px));padding:48px 32px;text-align:center;border:1px solid #303600;border-radius:16px;background:#111;box-shadow:0 0 40px #a8c40012}
    .mark{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;margin-bottom:28px}
    h1{margin:0 0 14px;font-size:clamp(28px,6vw,42px)}p{margin:0;color:var(--muted);line-height:1.6}
  </style>
</head>
<body><main><div class="mark">The Ultimate Journey</div><h1>We’ll be right back.</h1><p>The site is temporarily offline while we complete scheduled maintenance. Please check back soon.</p></main></body>
</html>
