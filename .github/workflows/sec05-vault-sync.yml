name: SEC-05 Infisical Vault Sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-infisical-vault.ts'
      - '.github/workflows/sec05-vault-sync.yml'
  repository_dispatch:
    types: [trigger-sync]

jobs:
  sync-vault:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      INFISICAL_DOMAIN: https://us.infisical.com
      INFISICAL_PROJECT_ID: 6c7646e9-04dd-484a-a5d1-612b9582da15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Infisical CLI
        run: |
          curl -1sLf 'https://dl.cloudsmith.io/public/infisical/infisical-cli/setup.deb.sh' | sudo -E bash
          sudo apt-get update && sudo apt-get install -y infisical
      - name: Authenticate with Infisical (Universal Auth)
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$INFISICAL_CLIENT_ID" ] || [ -z "$INFISICAL_CLIENT_SECRET" ]; then
            echo "::error::INFISICAL_CLIENT_ID and INFISICAL_CLIENT_SECRET GitHub Actions secrets are required."
            exit 1
          fi
          INFISICAL_TOKEN="$(infisical login --method=universal-auth --client-id="$INFISICAL_CLIENT_ID" --client-secret="$INFISICAL_CLIENT_SECRET" --plain --silent)"
          if [ -z "$INFISICAL_TOKEN" ]; then
            echo "::error::Infisical Universal Auth returned an empty token."
            exit 1
          fi
          echo "INFISICAL_TOKEN=$INFISICAL_TOKEN" >> "$GITHUB_ENV"
      - name: Verify TUJ Infisical key alignment
        run: npx tsx scripts/tuj_infisical_sync_check.ts
      - name: Sync staging secrets
        env:
          SUPABASE_PROJECT_ID: snsxtpdwiclwnfcdpgqv
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_STAGING }}
        run: |
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "::error::Gate 2 blocked: SUPABASE_SERVICE_ROLE_KEY_STAGING is empty. Populate the staging service-role/secret key (never the anon key)."
            exit 1
          fi
          infisical run --domain="$INFISICAL_DOMAIN" --projectId="$INFISICAL_PROJECT_ID" --env staging -- npx tsx scripts/sync-infisical-vault.ts
      - name: Sync production secrets
        id: prod_sync
        env:
          SUPABASE_PROJECT_ID: dykyabqoilzvuncikzkd
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_PRODUCTION }}
        run: |
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY}" ]; then
            echo "production_sync=blocked" >> "$GITHUB_OUTPUT"
            echo "::warning::Production vault sync SKIPPED: SUPABASE_SERVICE_ROLE_KEY_PRODUCTION is unset/empty."
            echo "Do not use the anon key as a placeholder. An authorized human must copy the production service-role/secret key into the GitHub Actions secret."
            echo "Do not reuse SUPABASE_SERVICE_ROLE_KEY_STAGING for production."
            exit 0
          fi
          echo "production_sync=attempted" >> "$GITHUB_OUTPUT"
          infisical run --domain="$INFISICAL_DOMAIN" --projectId="$INFISICAL_PROJECT_ID" --env prod -- npx tsx scripts/sync-infisical-vault.ts
          echo "production_sync=ok" >> "$GITHUB_OUTPUT"
      - name: Gate 2 production credential requirement
        if: ${{ always() && steps.prod_sync.outcome == 'success' && steps.prod_sync.outputs.production_sync == 'blocked' }}
        run: |
          echo "::error::Gate 2 remains blocked: production service-role secret is not configured."
          echo "Preferred: populate SUPABASE_SERVICE_ROLE_KEY_PRODUCTION with the real service-role/secret key from project dykyabqoilzvuncikzkd API settings, then re-run SEC-05 once."
          echo "Not acceptable: anon key placeholder (would 401 Vault writes and muddy evidence)."
          echo "Validate success via workflow status and non-sensitive metadata only."
          exit 1
