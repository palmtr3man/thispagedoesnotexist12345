name: Generate canonical package-lock.json

on:
  push:
    branches:
      - feature/gate4-idempotency-sync
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/gate4-idempotency-sync

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate canonical package-lock.json
        run: |
          rm -f package-lock.json
          npm install --package-lock-only

      - name: Commit and push package-lock.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already canonical"
          else
            git commit -m "Generate canonical package-lock.json"
            git push origin HEAD:feature/gate4-idempotency-sync
          fi
