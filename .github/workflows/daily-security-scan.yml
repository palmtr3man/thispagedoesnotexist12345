name: Daily Security Scan

on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: daily-security-scan
  cancel-in-progress: false

jobs:
  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      INTERNAL_TOKEN: ${{ secrets.SEC06_INTERNAL_TOKEN }}
      BREACH_HANDLER_URL: ${{ secrets.HANDLE_SECURITY_SCAN_BREACH_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci

      - name: SEC-08 security gates
        id: sec08
        continue-on-error: true
        run: |
          if [ ! -f scripts/sec08-security-gates.mjs ]; then echo "SEC-08 gates not present — skipping."; exit 0; fi
          node scripts/sec08-security-gates.mjs > /tmp/sec08.out 2>&1

      - name: Dependency audit (production, high+)
        id: audit-production
        continue-on-error: true
        run: |
          set +e
          npm audit --omit=dev --audit-level=high --json > audit-production.json 2>&1
          status=$?
          echo "Production dependency audit exit status: $status"
          exit $status

      - name: Dependency audit (development and build, high+)
        id: audit-development
        continue-on-error: true
        run: |
          set +e
          npm audit --include=dev --audit-level=high --json > audit-development.json 2>&1
          status=$?
          echo "Development/build dependency audit exit status: $status"
          exit $status

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-audit-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            audit-production.json
            audit-development.json
            /tmp/sec08.out
          if-no-files-found: warn
          retention-days: 30

      - name: Write security summary
        if: always()
        run: |
          {
            echo "## Daily Security Scan"
            echo "- SEC-08 gates: **${{ steps.sec08.outcome }}**"
            echo "- Production dependency audit: **${{ steps.audit-production.outcome }}**"
            echo "- Development/build dependency audit: **${{ steps.audit-development.outcome }}**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Did anything surface?
        id: findings
        if: always()
        run: |
          found=false
          [ "${{ steps.sec08.outcome }}" = failure ] && found=true
          [ "${{ steps.audit-production.outcome }}" = failure ] && found=true
          [ "${{ steps.audit-development.outcome }}" = failure ] && found=true
          echo "found=$found" >> "$GITHUB_OUTPUT"

      - name: Ping email alert (advisory, no containment)
        if: always() && steps.findings.outputs.found == 'true'
        continue-on-error: true
        run: |
          if [ -n "$BREACH_HANDLER_URL" ] && [ -n "$INTERNAL_TOKEN" ]; then
            curl -sS -X POST "$BREACH_HANDLER_URL" -H "Authorization: Bearer $INTERNAL_TOKEN" -H "Content-Type: application/json" \
              -d "{\"scan\":\"Daily Security Scan (GitHub Actions)\",\"severity\":\"advisory\",\"contain\":false,\"findings\":\"SEC-08: ${{ steps.sec08.outcome }}; production audit: ${{ steps.audit-production.outcome }}; development/build audit: ${{ steps.audit-development.outcome }}\",\"run_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
          fi

      - name: Open or update tracking issue
        if: always() && steps.findings.outputs.found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'security-scan-finding';
            const body = `Daily security scan: SEC-08 ${{ steps.sec08.outcome }}, production audit ${{ steps.audit-production.outcome }}, development/build audit ${{ steps.audit-development.outcome }}. Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const existing = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: label, per_page: 1});
            if (existing.data.length) await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.data[0].number, body});
            else await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title: '[Security Scan] Open findings', labels: [label], body});
