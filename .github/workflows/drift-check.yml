name: "Netlify Guardrails: Drift Check"

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Check Credential Availability
        id: creds
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
        run: |
          # Trim before testing: requireEnv() in the scripts rejects whitespace-only
          # values, so a blank-but-not-empty secret must not pass this gate.
          trim() { printf '%s' "$1" | tr -d '[:space:]'; }
          missing=()
          [ -n "$(trim "${INFISICAL_CLIENT_ID}")" ] || missing+=("INFISICAL_CLIENT_ID")
          [ -n "$(trim "${INFISICAL_CLIENT_SECRET}")" ] || missing+=("INFISICAL_CLIENT_SECRET")
          [ -n "$(trim "${NETLIFY_AUTH_TOKEN}")" ] || missing+=("NETLIFY_AUTH_TOKEN")
          [ -n "$(trim "${NETLIFY_SITE_ID}")" ] || missing+=("NETLIFY_SITE_ID")
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=false" >> "$GITHUB_OUTPUT"
          msg="Drift check credentials unavailable: ${missing[*]}"
          # Only fork pull requests are excused: GitHub withholds secrets from them.
          # Same-repo pull requests do get secrets, so a missing value there is a
          # real misconfiguration and must fail rather than silently skip.
          if [ "${IS_FORK_PR}" = "true" ]; then
            echo "::notice::${msg} — skipping drift check (secrets are not exposed to pull_request runs from forks)."
            echo "### Drift check skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "${msg}. Secrets are not exposed to pull_request runs from forks; the check runs on push to main/develop." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::${msg}"
            exit 1
          fi

      - name: Install Infisical CLI
        if: steps.creds.outputs.available == 'true'
        run: |
          curl -1sLf 'https://dl.cloudsmith.io/public/infisical/infisical-cli/setup.deb.sh' | sudo -E bash
          sudo apt-get update && sudo apt-get install -y infisical

      - name: Authenticate with Infisical (Universal Auth)
        if: steps.creds.outputs.available == 'true'
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$INFISICAL_CLIENT_ID" ] || [ -z "$INFISICAL_CLIENT_SECRET" ]; then
            echo "::error::INFISICAL_CLIENT_ID and INFISICAL_CLIENT_SECRET GitHub Actions secrets are required."
            exit 1
          fi
          INFISICAL_TOKEN="$(infisical login --method=universal-auth --client-id="$INFISICAL_CLIENT_ID" --client-secret="$INFISICAL_CLIENT_SECRET" --plain --silent)"
          if [ -z "$INFISICAL_TOKEN" ]; then
            echo "::error::Infisical Universal Auth returned an empty token."
            exit 1
          fi
          echo "INFISICAL_TOKEN=$INFISICAL_TOKEN" >> "$GITHUB_ENV"

      - name: Run Drift Check
        if: steps.creds.outputs.available == 'true'
        env:
          STRICTNESS: ${{ github.ref == 'refs/heads/main' && 'fail' || (github.ref == 'refs/heads/develop' || github.event_name == 'pull_request') && 'fail' || 'warn' }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
        run: npm run drift-check
