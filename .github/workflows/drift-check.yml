name: "Netlify Guardrails: Drift Check"

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  drift-check:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Infisical CLI
        run: |
          set -euo pipefail
          npm install --global @infisical/cli@0.43.125
          command -v infisical
          infisical --version

      - name: Authenticate with Infisical (GitHub OIDC)
        env:
          INFISICAL_IDENTITY_ID: d7c719c4-943f-4204-acb2-d04994ae1516
          INFISICAL_PROJECT_ID: 6c7646e9-04dd-484a-a5d1-612b9582da15
        run: |
          set -euo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::GitHub OIDC token endpoint is unavailable. Ensure id-token: write is granted."
            exit 1
          fi
          oidc_token="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://github.com")"
          jwt="$(printf '%s' "$oidc_token" | jq -er '.value')"
          INFISICAL_TOKEN="$(infisical login --method=oidc --identity-id="$INFISICAL_IDENTITY_ID" --jwt="$jwt" --plain --silent)"
          if [ -z "$INFISICAL_TOKEN" ]; then
            echo "::error::Infisical OIDC authentication returned an empty token."
            exit 1
          fi
          echo "INFISICAL_TOKEN=$INFISICAL_TOKEN" >> "$GITHUB_ENV"
          echo "INFISICAL_PROJECT_ID=$INFISICAL_PROJECT_ID" >> "$GITHUB_ENV"

      - name: Run Drift Check
        env:
          STRICTNESS: ${{ github.ref == 'refs/heads/main' && 'fail' || (github.ref == 'refs/heads/develop' || github.event_name == 'pull_request') && 'fail' || 'warn' }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
        run: npm run drift-check
